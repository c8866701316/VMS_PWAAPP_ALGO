<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <!-- <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar> -->
  </ion-header>
  <ion-content class="ion-padding">
    <div class="background-container">
      <div style="display: flex; justify-content: space-around" >
        <img src="../../../assets/icon/ShriConnect.jpg" style="margin-top: 10px; width: 40%;"/>
      </div>
      <h2
        style="
          display: flex;
          justify-content: space-around;
          text-decoration-line: underline;
          color: white;
          font-weight: 700;
        "
      >
        WELCOME BACK 123
      </h2>
    </div>
    <div class="form-container">
      <form [formGroup]="loginFormGroup" (ngSubmit)="onSubmit()" class="ion-padding example-form">
 
            
            <!-- <ion-label position="stacked" class="ion-text-uppercase ion-text-bold">Username</ion-label> -->
            <ion-input label="User Name" label-placement="floating" fill="solid" placeholder="Username"  class="inputclass" formControlName="userId"></ion-input>
            <!-- <ion-input type="username" placeholder="Username" formControlName="username"></ion-input> -->
            <ion-icon name="warning" slot="end" color="danger" *ngIf="loginFormGroup.get('userId')?.hasError('userId') && isControlInvalidWrapper('userId')"></ion-icon>
            <ion-text color="danger" *ngIf="isControlInvalidWrapper('userId') && loginFormGroup.get('userId')?.hasError('required')">*Username is required</ion-text>
     
       
            <!-- <ion-label position="stacked" class="ion-text-uppercase ion-text-bold">Password</ion-label> -->
            
            <!-- <ion-input type="password" placeholder="Password" formControlName="password"></ion-input> -->
            <ion-input label="Password" type="password" label-placement="floating" fill="solid" placeholder="Password"  class="inputclass" formControlName="password"> </ion-input>
            <!-- <ion-input type="password" label="Password" value="NeverGonnaGiveYouUp"> -->
              <!-- <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input> -->
            <ion-icon name="warning" slot="end" color="danger" *ngIf="isControlInvalidWrapper('password')"></ion-icon>
            <ion-text color="danger" *ngIf="isControlInvalidWrapper('password')">*Password is required</ion-text>
      
          <ion-button expand="block" type="submit" [disabled]="!loginFormGroup.valid || (isLoading$ | async)">
            <ion-spinner *ngIf="(isLoading$ | async)"></ion-spinner>
            <span *ngIf="!(isLoading$ | async)">Login</span>
          </ion-button>
      </form>
    </div>
  </ion-content>
</ion-content>
